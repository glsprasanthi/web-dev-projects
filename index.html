<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>Expense Tracker 📊</h1>

        <div class="summary-container">
            <div class="summary-box">
                <h3>This Week's Spending</h3>
                <p id="weekly-total">₹0.00</p>
            </div>
            <div class="summary-box">
                <h3>This Month's Spending</h3>
                <p id="monthly-total">₹0.00</p>
            </div>
            <div class="summary-box">
                <h3>Monthly Change</h3>
                <p id="month-comparison">--</p>
            </div>
        </div>

        <div class="chart-container">
            <h2>Monthly Spending Breakdown</h2>
            <canvas id="category-chart"></canvas>
        </div>

        <form id="expense-form">
            <h2>Add New Expense</h2>
            <div class="form-group">
                <input type="text" id="description" placeholder="Expense Description" required>
            </div>
            <div class="form-group">
                <input type="number" id="amount" placeholder="Amount (₹)" min="0.01" step="0.01" required>
            </div>
            <div class="form-group">
                <select id="category" required>
                    <option value="" disabled selected>Select a Category</option>
                </select>
            </div>
            <button type="submit">Add Expense</button>
        </form>

        <div id="category-manager">
            <h2>Manage Categories</h2>
            <div class="form-group-inline">
                 <input type="text" id="new-category" placeholder="New Category Name">
                 <button id="add-category-btn">Add Category</button>
            </div>
        </div>

        <h2>My Expenses</h2>
        <div id="expense-list-container">
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
